name: Deploy Failure AI Gateway Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/failure-ai-worker/**"
      - ".github/workflows/deploy-ai-check-gateway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler@3

      - name: Push secrets to Cloudflare
        working-directory: workers/failure-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SECRET_INTERNAL_KEY: ${{ secrets.AI_GATEWAY_SECRET_INTERNAL_KEY }}
          SECRET_CALLER_KEY: ${{ secrets.AI_GATEWAY_SECRET_CALLER_KEY }}
          GITHUB_TOKEN_SECRET: ${{ secrets.AI_GATEWAY_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are missing" >&2
            exit 1
          fi
          if [ -z "$SECRET_INTERNAL_KEY" ]; then
            echo "AI_GATEWAY_SECRET_INTERNAL_KEY is required" >&2
            exit 1
          fi
          if [ -z "$GITHUB_TOKEN_SECRET" ]; then
            echo "AI_GATEWAY_GITHUB_TOKEN is required" >&2
            exit 1
          fi

          echo "$SECRET_INTERNAL_KEY" | wrangler secret put SECRET_INTERNAL_KEY --env production --config ./wrangler.toml

          if [ -n "$SECRET_CALLER_KEY" ]; then
            echo "$SECRET_CALLER_KEY" | wrangler secret put SECRET_CALLER_KEY --env production --config ./wrangler.toml
          fi

          echo "$GITHUB_TOKEN_SECRET" | wrangler secret put GITHUB_TOKEN --env production --config ./wrangler.toml

      - name: Deploy worker
        working-directory: workers/failure-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --env production --config ./wrangler.toml
