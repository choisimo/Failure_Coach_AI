name: Deploy Failure AI Gateway Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/failure-ai-worker/**"
      - ".github/workflows/deploy-ai-check-gateway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler@3

      - name: Push secrets to Cloudflare
        working-directory: workers/failure-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          _OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
          _OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          _OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF_API_TOKEN and CF_ACCOUNT_ID are required" >&2
            exit 1
          fi
          if [ -z "$_OPENAI_API_URL" ] || [ -z "$_OPENAI_API_KEY" ] || [ -z "$_OPENAI_MODEL" ]; then
            echo "OPENAI_API_URL, OPENAI_API_KEY, and OPENAI_MODEL are required" >&2
            exit 1
          fi

          echo "$_OPENAI_API_URL" | wrangler secret put OPENAI_API_URL --env production --config ./wrangler.toml
          echo "$_OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --env production --config ./wrangler.toml
          echo "$_OPENAI_MODEL"   | wrangler secret put OPENAI_MODEL   --env production --config ./wrangler.toml

      - name: Deploy worker
        working-directory: workers/failure-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy --env production --config ./wrangler.toml
