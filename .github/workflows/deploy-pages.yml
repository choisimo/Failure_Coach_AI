name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "postcss.config.js"
      - "tailwind.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL || 'https://ai-serve.nodove.com' }}
          VITE_AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_PUBLIC_KEY }}

      - name: Bundle wiki docs
        if: ${{ hashFiles('docs/**') != '' }}
        run: |
          mkdir -p dist/wiki-docs
          cp -r docs/* dist/wiki-docs/
          if [ -f dist/wiki-docs/wiki-index.html ]; then
            mv dist/wiki-docs/wiki-index.html dist/wiki-docs/index.html
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
