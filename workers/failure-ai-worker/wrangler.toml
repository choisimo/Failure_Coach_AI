name = "failure_ai_check_gateway"
main = "./src/index.ts"
compatibility_date = "2025-10-28"
compatibility_flags = ["nodejs_compat"]

# Secrets managed via GitHub Actions (wrangler secret put):
#   OPENAI_API_URL   — upstream OpenAI-compatible base URL
#   OPENAI_API_KEY   — upstream API key
#   OPENAI_MODEL     — model name (e.g. gpt-4o)

[env.production]
name = "failure_ai_check_gateway"

[env.production.vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://localhost:4173,https://ai-failure-chat.nodove.com"

[[env.production.routes]]
pattern = "ai-failure.nodove.com/*"
zone_name = "nodove.com"
