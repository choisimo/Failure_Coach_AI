<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Wiki Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Pretendard", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #ecf2ff 0%, #f8fbff 40%, #ffffff 100%);
        color: #0b1220;
        display: flex;
        min-height: 100vh;
      }
      aside {
        width: 280px;
        background: #101936;
        color: #f8fafc;
        padding: 28px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 4px 0 24px rgba(16, 25, 54, 0.28);
        position: relative;
        z-index: 50;
      }
      aside h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      nav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
        transition: background 0.2s ease, transform 0.15s ease;
      }
      nav a:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateX(3px);
      }
      nav a.active {
        background: linear-gradient(90deg, rgba(14, 165, 233, 0.55), rgba(59, 130, 246, 0.65));
        font-weight: 600;
        color: white;
        box-shadow: 0 8px 16px rgba(37, 99, 235, 0.28);
      }
      nav small {
        font-size: 0.7rem;
        opacity: 0.7;
        margin-left: 12px;
      }
      .nav-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(2px);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 40;
      }
      body.nav-open .nav-overlay {
        opacity: 1;
        pointer-events: auto;
      }
      .nav-sublist {
        list-style: none;
        margin: 0;
        padding: 4px 0 4px 12px;
        border-left: 1px solid rgba(148, 163, 184, 0.3);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav-sublist a {
        font-size: 0.82rem;
        color: rgba(241, 245, 249, 0.94);
        text-decoration: none;
        padding: 4px 6px;
        border-radius: 8px;
        display: block;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .nav-sublist a:hover {
        background: rgba(56, 189, 248, 0.16);
        color: #f0f9ff;
      }
      .nav-sublist li.level-3 a {
        padding-left: 18px;
        font-size: 0.78rem;
        opacity: 0.9;
      }
      .nav-sublist a.active-heading {
        background: rgba(56, 189, 248, 0.25);
        color: #f8fafc;
      }
      main {
        flex: 1;
        padding: 48px 36px;
        overflow-y: auto;
        backdrop-filter: blur(6px);
      }
      main h1 {
        margin-top: 0;
      }
      .markdown-body {
        max-width: 960px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.98);
        padding: 40px 48px;
        border-radius: 20px;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.12);
        color: #0f172a;
        line-height: 1.68;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        color: #0b1220;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body li,
      .markdown-body blockquote {
        color: #1e293b;
      }
      .markdown-body a {
        color: #0369a1;
        text-decoration: underline;
        text-decoration-thickness: 2px;
      }
      .markdown-body code {
        background: rgba(15, 23, 42, 0.08);
        color: #0f172a;
        border-radius: 6px;
        padding: 2px 6px;
      }
      .markdown-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }
      .markdown-body pre {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 12px;
        padding: 18px 20px;
        line-height: 1.55;
        overflow-x: auto;
      }
      .markdown-body table {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.4);
      }
      .markdown-body th {
        background: rgba(148, 163, 184, 0.15);
        color: #0f172a;
      }
      .markdown-body td {
        color: #1f2937;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: rgba(14, 165, 233, 0.18);
        color: #0369a1;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .search-box {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search-box input {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 10px 12px 10px 38px;
        background: rgba(255, 255, 255, 0.18);
        color: #f8fafc;
        outline: none;
        transition: border 0.2s ease, background 0.2s ease;
      }
      .search-box input::placeholder {
        color: rgba(248, 250, 252, 0.6);
      }
      .search-box input:focus {
        border-color: rgba(56, 189, 248, 0.8);
        background: rgba(56, 189, 248, 0.16);
      }
      .search-box svg {
        position: absolute;
        left: 10px;
        width: 16px;
        height: 16px;
        opacity: 0.65;
      }
      .toc {
        border-left: 4px solid rgba(14, 165, 233, 0.35);
        padding-left: 16px;
        margin: 28px 0;
        background: rgba(14, 165, 233, 0.12);
        border-radius: 10px;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .toc h2 {
        margin-top: 0;
        font-size: 1rem;
        color: #0369a1;
      }
      .toc ul {
        list-style: none;
        padding-left: 0;
        margin: 0;
        display: grid;
        gap: 4px;
      }
      .toc a {
        color: #0369a1;
        text-decoration: none;
      }
      .toc a:hover {
        text-decoration: underline;
      }
      #meta-panel {
        background: rgba(15, 23, 42, 0.44);
        border-radius: 14px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 0.8rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      #meta-panel strong {
        font-weight: 600;
        color: #f0f9ff;
      }
      details summary {
        cursor: pointer;
        font-weight: 600;
        color: rgba(248, 250, 252, 0.85);
      }
      footer {
        margin-top: 24px;
        font-size: 0.85rem;
        color: rgba(8, 16, 41, 0.65);
      }
      .mobile-toggle {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: rgba(14, 165, 233, 0.16);
        color: #0369a1;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 18px;
        box-shadow: 0 6px 16px rgba(14, 165, 233, 0.2);
        transition: transform 0.15s ease;
      }
      .mobile-toggle:active {
        transform: scale(0.98);
      }
      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }
        aside {
          width: 80vw;
          max-width: 320px;
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          transform: translateX(-105%);
          transition: transform 0.28s ease;
          padding: 24px 18px 32px;
          overflow-y: auto;
          border-radius: 0 24px 24px 0;
        }
        body.nav-open aside {
          transform: translateX(0);
        }
        nav {
          flex-direction: column;
          gap: 6px;
          overflow-x: visible;
        }
        nav a {
          white-space: normal;
        }
        main {
          padding: 24px;
        }
        .markdown-body {
          padding: 28px;
        }
        .mobile-toggle {
          display: inline-flex;
        }
        body.nav-open {
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <h1>Wiki Docs</h1>
        <p style="margin: 4px 0 0; opacity: 0.7; font-size: 0.85rem;">Self Insight Chat · IRL 문서 허브</p>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" placeholder="문서 검색" />
      </div>
      <div id="meta-panel">
        <div><strong>총 문서</strong> <span id="doc-count">0</span>개</div>
        <div><strong>현재 문서</strong> <span id="doc-meta-title">-</span></div>
        <div><strong>최종 업데이트</strong> <span id="doc-meta-updated">-</span></div>
      </div>
      <details open>
        <summary>문서 목록</summary>
        <nav id="doc-nav"></nav>
      </details>
      <a href="../" style="margin-top: auto; color: rgba(226, 232, 240, 0.85); font-size: 0.85rem; text-decoration: none;">← 메인 앱으로 돌아가기</a>
    </aside>
    <div id="nav-overlay" class="nav-overlay"></div>
    <main>
      <button id="nav-toggle" class="mobile-toggle">
        <span style="font-size: 1.2rem;">☰</span>
        <span>문서 메뉴</span>
      </button>
      <article class="markdown-body">
        <div class="badge">📚 IRL Wiki</div>
        <h1 id="doc-title">문서를 불러오는 중...</h1>
        <section class="toc" id="doc-toc" hidden>
          <h2>목차</h2>
          <ul id="toc-list"></ul>
        </section>
        <div id="doc-body">잠시만 기다려주세요.</div>
        <footer>
          <p>GitHub Pages · <code>/wiki-docs/</code> · markdown 렌더링 by <a href="https://marked.js.org/" target="_blank">marked.js</a>.</p>
        </footer>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script>
      const DOCS = [
        { file: "irl-hybrid-spec.md", title: "IRL 하이브리드 재랭킹 및 관측성 스펙", category: "스펙" },
        { file: "irl-refactor-prd.md", title: "IRL 리팩토링 PRD", category: "프로젝트" },
        { file: "irl-hybrid-backlog.md", title: "IRL 하이브리드 백로그", category: "프로젝트" },
        { file: "telemetry/irl-telemetry-schema.md", title: "IRL 텔레메트리 스키마", category: "텔레메트리" },
        { file: "api/irl-hybrid-openapi.yaml", title: "IRL Hybrid OpenAPI 스펙", category: "API" },
        { file: "api/swagger-ui.html", title: "Swagger UI (열기)", category: "API", external: true }
      ];

      const navEl = document.getElementById("doc-nav");
      const titleEl = document.getElementById("doc-title");
      const bodyEl = document.getElementById("doc-body");
      const metaTitleEl = document.getElementById("doc-meta-title");
      const metaUpdatedEl = document.getElementById("doc-meta-updated");
      const docCountEl = document.getElementById("doc-count");
      const tocEl = document.getElementById("doc-toc");
      const tocListEl = document.getElementById("toc-list");
      const searchInput = document.getElementById("search-input");
      const navToggle = document.getElementById("nav-toggle");
      const navOverlay = document.getElementById("nav-overlay");
      const rootBody = document.body;

      const params = new URLSearchParams(window.location.search);
      let activeDoc = params.get("doc") || DOCS[0].file;

      marked.use({
        breaks: true,
        mangle: false,
        headerIds: true,
        headerPrefix: "wiki-heading-"
      });

      docCountEl.textContent = DOCS.length;

      function formatDate(date) {
        return date.toLocaleString("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      async function getFileMeta(path) {
        try {
          const res = await fetch(`./${path}?_=${Date.now()}`, { method: "HEAD" });
          if (!res.ok) return null;
          const updated = res.headers.get("last-modified");
          return updated ? new Date(updated) : null;
        } catch {
          return null;
        }
      }

      let currentFilterText = "";
      let activeDocHeadings = [];

      function openNav() {
        rootBody.classList.add("nav-open");
      }

      function closeNav() {
        rootBody.classList.remove("nav-open");
      }

      function toggleNav() {
        rootBody.classList.toggle("nav-open");
      }

      function renderNav(filterText = "") {
        currentFilterText = filterText;
        navEl.innerHTML = "";
        DOCS.filter((doc) => {
          return doc.title.toLowerCase().includes(filterText.toLowerCase());
        }).forEach((doc) => {
          const item = document.createElement("div");
          item.className = "nav-item";

          const link = document.createElement("a");
          if (doc.external) {
            link.href = `./${doc.file}`;
            link.target = "_blank";
            link.rel = "noopener";
          } else {
            link.href = `?doc=${doc.file}`;
          }
          const titleSpan = document.createElement("span");
          titleSpan.textContent = doc.title;
          const cat = document.createElement("small");
          cat.textContent = doc.category;
          link.append(titleSpan, cat);
          if (doc.file === activeDoc && !doc.external) {
            link.classList.add("active");
            const docHeadings = activeDocHeadings.length > 0 ? activeDocHeadings : doc.headings || [];
            if (docHeadings.length > 0) {
              const subList = document.createElement("ul");
              subList.className = "nav-sublist";
              docHeadings.forEach((heading) => {
                const li = document.createElement("li");
                li.className = `level-${heading.level}`;
                const subLink = document.createElement("a");
                subLink.href = `#${heading.id}`;
                subLink.textContent = heading.text;
                subLink.addEventListener("click", (event) => {
                  event.preventDefault();
                  const headingEl = document.getElementById(heading.id);
                  if (headingEl) {
                    headingEl.scrollIntoView({ behavior: "smooth", block: "start" });
                    setTimeout(() => {
                      document.querySelectorAll(".nav-sublist a.active-heading").forEach((el) => el.classList.remove("active-heading"));
                      subLink.classList.add("active-heading");
                    }, 0);
                    closeNav();
                  }
                });
                li.appendChild(subLink);
                subList.appendChild(li);
              });
              item.appendChild(subList);
            }
          }
          link.addEventListener("click", () => {
            closeNav();
          });
          item.prepend(link);
          navEl.appendChild(item);
        });
      }

      function buildTOC() {
        const headings = bodyEl.querySelectorAll("h1, h2, h3");
        tocListEl.innerHTML = "";
        const items = Array.from(headings).filter((h) => h.id);
        if (items.length === 0) {
          tocEl.hidden = true;
          return;
        }
        items.forEach((heading) => {
          if (heading.tagName.toLowerCase() === "h1") return;
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `#${heading.id}`;
          a.textContent = heading.textContent;
          li.style.paddingLeft = heading.tagName === "H3" ? "12px" : "0";
          li.appendChild(a);
          tocListEl.appendChild(li);
        });
        tocEl.hidden = false;
      }

      async function loadDoc(file) {
        try {
          const response = await fetch(`./${file}`);
          if (!response.ok) throw new Error("문서를 불러오지 못했습니다.");
          const raw = await response.text();
          const meta = DOCS.find((doc) => doc.file === file);
          titleEl.textContent = meta?.title ?? file;

          const collectedHeadings = [];
          const slugger = new marked.Slugger();
          const renderer = new marked.Renderer();
          const headingPrefix = "wiki-heading-";

          renderer.heading = function (text, level, rawText) {
            const slug = slugger.slug(rawText);
            const id = `${headingPrefix}${slug}`;
            const plain = text.replace(/<[^>]+>/g, "");
            if (level <= 3) {
              collectedHeadings.push({ id, text: plain, level });
            }
            return `<h${level} id="${id}">${text}</h${level}>`;
          };

          const html = marked.parse(raw, { renderer, slugger });
          bodyEl.innerHTML = html;
          Prism.highlightAllUnder(bodyEl);
          const updatedDate = await getFileMeta(file);
          metaTitleEl.textContent = meta?.title ?? file;
          metaUpdatedEl.textContent = updatedDate ? formatDate(updatedDate) : "-";
          buildTOC();
          activeDocHeadings = collectedHeadings;
          const doc = DOCS.find((d) => d.file === file);
          if (doc) {
            doc.headings = activeDocHeadings;
          }
          renderNav(currentFilterText);
        } catch (error) {
          titleEl.textContent = "문서를 불러오는 중 오류 발생";
          bodyEl.textContent = error.message;
          metaTitleEl.textContent = "-";
          metaUpdatedEl.textContent = "-";
          tocEl.hidden = true;
          activeDocHeadings = [];
          renderNav(currentFilterText);
        }
      }

      renderNav();
      loadDoc(activeDoc);

      searchInput.addEventListener("input", (event) => {
        const value = event.target.value.trim();
        renderNav(value);
      });

      if (navToggle) {
        navToggle.addEventListener("click", toggleNav);
      }
      if (navOverlay) {
        navOverlay.addEventListener("click", closeNav);
      }

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeNav();
        }
      });

      window.matchMedia("(min-width: 769px)").addEventListener("change", (event) => {
        if (event.matches) {
          closeNav();
        }
      });
    </script>
  </body>
</html>
