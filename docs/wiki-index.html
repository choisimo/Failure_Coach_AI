<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Wiki Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css" />
    <style>
      body {
        margin: 0;
        font-family: "Pretendard", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #081029;
        display: flex;
        min-height: 100vh;
      }
      aside {
        width: 260px;
        background: #0f172a;
        color: white;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      aside h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      nav a {
        display: block;
        padding: 10px 12px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        font-size: 0.95rem;
      }
      nav a.active {
        background: rgba(255, 255, 255, 0.18);
        font-weight: 600;
      }
      main {
        flex: 1;
        padding: 32px;
        overflow-y: auto;
      }
      main h1 {
        margin-top: 0;
      }
      #doc-content {
        max-width: 960px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }
      #doc-content pre {
        background: #0f172a;
        color: #f8fafc;
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      #doc-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
      }
      #doc-content th,
      #doc-content td {
        border: 1px solid rgba(148, 163, 184, 0.6);
        padding: 8px 12px;
      }
      #doc-content blockquote {
        border-left: 4px solid #0ea5e9;
        background: rgba(14, 165, 233, 0.08);
        padding: 12px 16px;
        margin: 12px 0;
      }
      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }
        aside {
          width: 100%;
          flex-direction: row;
          overflow-x: auto;
        }
        nav {
          display: flex;
          gap: 8px;
        }
        nav a {
          white-space: nowrap;
        }
        main {
          padding: 16px;
        }
        #doc-content {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <h1>Wiki Docs</h1>
        <p style="margin: 4px 0 0; opacity: 0.7; font-size: 0.85rem;">Self Insight Chat · IRL 문서 허브</p>
      </div>
      <nav id="doc-nav"></nav>
    </aside>
    <main>
      <div id="doc-content">
        <h1 id="doc-title">문서를 불러오는 중...</h1>
        <div id="doc-body" class="markdown-body">잠시만 기다려주세요.</div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      const DOCS = [
        { file: "irl-hybrid-spec.md", title: "IRL 하이브리드 재랭킹 및 관측성 스펙" },
        { file: "irl-refactor-prd.md", title: "IRL 리팩토링 PRD" },
        { file: "irl-hybrid-backlog.md", title: "IRL 하이브리드 백로그" }
      ];

      const navEl = document.getElementById("doc-nav");
      const titleEl = document.getElementById("doc-title");
      const bodyEl = document.getElementById("doc-body");

      const params = new URLSearchParams(window.location.search);
      let activeDoc = params.get("doc") || DOCS[0].file;

      function updateNav() {
        navEl.innerHTML = "";
        DOCS.forEach((doc) => {
          const link = document.createElement("a");
          link.href = `?doc=${doc.file}`;
          link.textContent = doc.title;
          if (doc.file === activeDoc) {
            link.classList.add("active");
          }
          navEl.appendChild(link);
        });
      }

      async function loadDoc(file) {
        try {
          const response = await fetch(`./${file}`);
          if (!response.ok) throw new Error("문서를 불러오지 못했습니다.");
          const raw = await response.text();
          titleEl.textContent = DOCS.find((doc) => doc.file === file)?.title ?? file;
          bodyEl.innerHTML = marked.parse(raw, { breaks: true });
        } catch (error) {
          titleEl.textContent = "문서를 불러오는 중 오류 발생";
          bodyEl.textContent = error.message;
        }
      }

      updateNav();
      loadDoc(activeDoc);
    </script>
  </body>
</html>
